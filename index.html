function filters(){return `<form class="filter-card" id="search-form"><div class="filter-row"><label>소속명</label><strong>${SCHOOL}</strong></div><div class="filter-row"><label for="date-from">가입기간</label><input type="date" id="date-from" aria-label="가입기간 시작" value="${esc(state.dateFrom)}"><span>~</span><input type="date" id="date-to" aria-label="가입기간 종료" value="${esc(state.dateTo)}"></div><div class="filter-row"><label for="keyword">검색어</label><select id="search-by" aria-label="검색 기준"><option value="name" ${state.searchBy==='name'?'selected':''}>이름</option><option value="email" ${state.searchBy==='email'?'selected':''}>아이디</option></select><input class="keyword" id="keyword" aria-label="검색어" value="${esc(state.keyword)}" autocomplete="off"><button class="small" type="button" data-action="clear-filter">초기화</button><button class="small dark" id="search" type="submit">⌕ 검색</button></div></form>`;}
function list(page){const titles={pending:'교사 승인 관리',rejected:'교사 반려 관리',members:'교사 회원 관리'},status={pending:'pending',rejected:'rejected',members:'approved'};let rows=state.teachers.filter(t=>t.status===status[page]);if(state.query)rows=rows.filter(t=>t[state.searchBy].toLowerCase().includes(state.query.toLowerCase()));if(state.filterFrom)rows=rows.filter(t=>t.joined.slice(0,10).replaceAll('.','-')>=state.filterFrom);if(state.filterTo)rows=rows.filter(t=>t.joined.slice(0,10).replaceAll('.','-')<=state.filterTo);
const pending=page==='pending',rejected=page==='rejected';return `<div class="page-title"><h2>${titles[page]}</h2><div class="breadcrumbs">⌂　›　회원 관리　›　${titles[page]}</div></div>${filters()}<div class="table-bar"><strong>전체 ${rows.length}${pending&&state.selected.length?` <span class="subtle">· 선택 ${state.selected.length}명</span>`:''}</strong>${pending?'<div><button id="reject" data-action="reject">반려</button> <button id="approve" data-action="approve">승인</button></div>':''}</div><div class="table-scroll"><table><thead><tr>${pending?'<th><label class="check-wrap"><input type="checkbox" aria-label="전체 선택" data-all="true"></label></th>':''}<th>번호</th>${rejected?'<th>상태</th>':''}${page!=='members'?`<th>${rejected?'반려유형':'승인유형'}</th>`:''}<th>이름</th><th>아이디</th><th>가입일시</th>${rejected?'<th>반려일시</th>':''}${page==='members'?'<th>사용여부</th>':''}</tr></thead><tbody>${rows.map((t,i)=>`<tr ${t.id==='t3'&&rejected?'id="review-row"':''}>${pending?`<td><label class="check-wrap" id="check-${t.id}"><input type="checkbox" aria-label="${t.name} 선택" data-check="${t.id}" ${state.selected.includes(t.id)?'checked':''}></label></td>`:''}<td>${rows.length-i}</td>${rejected?'<td><span class="status-pill rejected">반려</span></td>':''}${page!=='members'?`<td>${t.type}</td>`:''}<td><button class="link-btn" id="name-${t.id}" data-action="${rejected?'rejected-detail':'detail'}" data-id="${t.id}">${t.name}</button></td><td><button class="link-btn" data-action="${rejected?'rejected-detail':'detail'}" data-id="${t.id}">${t.email}</button></td><td>${t.joined}</td>${rejected?`<td>${t.rejected}</td>`:''}${page==='members'?`<td>${t.use?'사용':'미사용'}</td>`:''}</tr>`).join('')||`<tr><td colspan="8" class="empty">조회된 회원이 없습니다.</td></tr>`}</tbody></table></div><div class="paging"><div><button data-action="one-page" aria-label="이전 페이지">‹</button><b>1</b><button data-action="one-page" aria-label="다음 페이지">›</button></div><select aria-label="페이지당 표시 수" id="page-size"><option>10개씩 보기</option><option>20개씩 보기</option><option>50개씩 보기</option></select></div>`;}
function historyPanel(t){return `<div class="info-section history-section"><h3>회원정보 수정이력</h3><div class="filter-card history-filter"><div class="filter-row"><label for="history-from">수정기간</label><input type="date" id="history-from" aria-label="수정기간 시작"><span>~</span><input type="date" id="history-to" aria-label="수정기간 종료"></div><div class="filter-row"><label for="history-keyword">검색어</label><select id="history-by" aria-label="수정이력 검색 기준"><option value="name">이름</option><option value="email">아이디</option></select><input class="keyword" id="history-keyword" aria-label="수정이력 검색어"><button class="small" data-action="history-clear">초기화</button><button class="small dark" data-action="history-search">⌕ 검색</button></div></div><div id="history-result">${historyRows(t)}</div></div>`;}
function historyRows(t,query='',by='name',from='',to=''){const date='2026-10-18';const match=(by==='email'?'school.admin@example.com':'학교관리자').includes(query);return `<table class="history-table"><thead><tr><th>수정일시</th><th>수정자</th><th>수정 내용</th></tr></thead><tbody>${t.modified&&match&&(!from||date>=from)&&(!to||date<=to)?'<tr><td>2026.10.18 10:10</td><td>학교관리자</td><td>회원정보 수정</td></tr>':'<tr><td colspan="3" class="empty">조회된 수정이력이 없습니다.</td></tr>'}</tbody></table>`;}
function detail(){const t=state.teachers.find(t=>t.id===state.detailId),edit=state.edit;return `<div class="member-detail"><div class="page-title"><h2>교사 회원 관리</h2><div class="breadcrumbs">⌂　›　회원 관리　›　교사 회원 관리</div></div><div class="section-title"><span>회원정보</span><button class="small primary" id="${edit?'save':'edit'}" data-action="${edit?'save':'edit'}">${edit?'저장':'수정'}</button></div><div class="info-section"><h3>기본정보</h3><div class="detail-grid"><div class="term">이름</div><div>${edit?`<input type="text" id="teacher-name" aria-label="교사 이름" value="${esc(t.name)}">`:esc(t.name)}</div><div class="term">아이디</div><div>${esc(t.email)}</div>${edit?`<div class="term">비밀번호</div><div><button class="small" id="reset-pw" data-action="reset-pw">비밀번호 초기화</button>${state.passwordReset?'<span class="status-pill"> 초기화 완료</span>':''}</div>`:''}</div></div><div class="info-section"><h3>부가정보</h3><div class="detail-grid"><div class="term">소속명</div><div>${SCHOOL}</div><div class="term">교육행정인증서</div><div>만료일자 : 2027.10.18</div><div class="term">알림 수신 방식</div><div>${edit?`<div class="contact-edit"><label for="mobile">휴대전화</label><span> | </span><input id="mobile" type="tel" aria-label="알림 수신 연락처" maxlength="13" value="${esc(state.draftMobile??t.mobile)}"></div>`:`휴대전화 | ${esc(t.mobile)}`}</div><div class="term">알림 수신 동의</div><div>${edit?`<div class="radios"><label><input type="radio" name="sms" value="yes" ${t.sms?'checked':''}>수신 동의</label><label><input type="radio" name="sms" value="no" ${!t.sms?'checked':''}>수신 미동의</label></div>`:(t.sms?'Y':'N')}</div></div></div><div class="detail-bottom"><button data-action="back">목록</button><button class="primary" data-action="${edit?'save':'edit'}">${edit?'저장':'수정'}</button></div>${!edit?historyPanel(t):''}</div>`;}
function rejectedDetail(){const t=state.teachers.find(t=>t.id===state.detailId);return `<div class="member-detail"><div class="page-title"><h2>교사 반려 관리</h2></div><div class="section-title"><span>회원정보</span></div><div class="info-section"><h3>기본정보</h3><div class="detail-grid"><div class="term">이름</div><div>${esc(t.name)}</div><div class="term">아이디</div><div>${esc(t.email)}</div></div></div><div class="info-section"><h3>부가정보</h3><div class="detail-grid"><div class="term">소속명</div><div>${SCHOOL}</div><div class="term">알림 수신 방식</div><div>휴대전화 | ${esc(t.mobile)}</div><div class="term">알림 수신 동의</div><div>${t.sms?'Y':'N'}</div><div class="term">가입일시</div><div>${esc(t.joined)}</div></div></div><div class="info-section"><h3>반려정보</h3><div class="detail-grid"><div class="term">반려 사유</div><div class="reason-content">${esc(t.reason||'소속 학교가 일치하지 않아 반려합니다.')}</div><div class="term">반려일시</div><div>${esc(t.rejected)}</div><div class="term">반려 관리자</div><div>관리자(school.admin@example.com)</div></div></div><div class="detail-bottom"><button id="reject-back" data-action="review">목록</button></div></div>`;}
function complete(){return `<div class="complete"><div class="complete-inner"><div class="checkmark">✓</div><div class="guide-kicker" style="margin-top:20px">ALL MISSIONS COMPLETED</div><h2>학교관리자 업무,<br>이제 직접 할 수 있어요.</h2><p>${SCHOOL}의 교사 계정으로<br>8개 미션을 모두 완료했습니다.</p><div class="summary-tags"><span>✓ 교사 2명 승인</span><span>✓ 잘못 신청한 계정 반려</span><span>✓ 반려 사유 입력·확인</span><span>✓ 회원 검색·조회</span><span>✓ 연락처 변경·저장</span><span>✓ 비밀번호 초기화</span></div><button class="primary" data-action="restart-now">처음부터 다시 실습하기 ↻</button> <a class="course-tab" href="student.html">학생 회원 관리 실습 →</a><div class="mini-note">AIEP 학교 관리자 매뉴얼 v5.0 · 1. 교사 승인 관리</div></div></div>`;}
function renderModal(){const m=state.modal;if(!m){$('modal-root').innerHTML='';return;}const reset=m.kind==='restart',reason=m.kind==='reject-reason';$('modal-root').innerHTML=`<div class="overlay"><div class="modal ${reason?'reason-modal':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc"><div class="modal-icon">${m.success?'✓':reset?'↻':'?'}</div><h2 id="modal-title">${esc(m.title)}</h2><p id="modal-desc">${esc(m.text)}</p>${reason?`<div class="reason-field"><label for="reason-input">반려 사유 <span class="required">*</span></label><textarea id="reason-input" maxlength="500" rows="4" aria-required="true" aria-describedby="reason-error" placeholder="반려 사유를 입력해 주세요.">${esc(state.reasonDraft)}</textarea><div id="reason-error" class="reason-error" role="alert"></div><small>최대 500자 · 입력한 내용은 반려 상세 정보에 표시됩니다.</small></div>`:''}<div class="modal-actions">${m.confirm||reset||reason?'<button data-action="modal-cancel">취소</button>':''}<button class="primary" id="${reason?'reason-submit':'modal-confirm'}" data-action="${reason?'reject-reason':reset?'restart-now':'modal-confirm'}">${reason?'반려':reset?'다시 시작':'확인'}</button></div></div></div>`;}
function render(){renderGuide();$('screen').innerHTML=state.step>=steps.length?complete():state.page==='home'?home():state.page==='login'?login():adminShell();renderModal();highlight();if(state.modal)queueMicrotask(()=>$(state.modal?.kind==='reject-reason'?'reason-input':'modal-confirm')?.focus({preventScroll:true}));}
function openConfirmation(kind,title,text){state.modal={kind,title,text,confirm:true};advance();}
function ack(title,text,kind){state.modal={title,text,kind,success:true};advance();}
function commitEdit(){const t=state.teachers.find(t=>t.id===state.detailId),name=$('teacher-name')?.value.trim(),mobile=$('mobile')?.value.replace(/[^0-9]/g,'');if(!name){toast('이름을 입력해 주세요.');return false;}if(mobile!=='01000001234'){toast('실습용 연락처 01000001234를 입력해 주세요.');return false;}if(name!=='김하늘'){toast('이번 실습에서는 김하늘 선생님의 이름을 유지해 주세요.');return false;}t.name=name;t.mobile=mobile;t.sms=document.querySelector('input[name="sms"]:checked')?.value==='yes';t.modified=true;state.draftMobile=null;state.edit=false;return true;}
function doAction(action,el){if(action==='outside'){toast('이번 실습은 교사 승인·반려·교사 회원 관리 범위입니다.');return;}
if(action==='restart'){state.restartReturnModal=state.modal;state.modal={kind:'restart',title:'처음부터 다시 실습할까요?',text:'현재 실습 진행과 가상 계정의 변경 내용이 초기화됩니다.'};renderModal();$('modal-confirm').focus();return;}
if(action==='restart-now'){state=initialState();persist();render();return;}
if(action==='modal-cancel'){if(state.modal?.kind==='restart'){state.modal=state.restartReturnModal||null;delete state.restartReturnModal;persist();render();return;}if(state.modal?.confirm||state.modal?.kind==='reject-reason'){const m=state.modal;state.step--;state.modal=m.kind==='reject'?{kind:'reject-reason',title:'교사 가입 반려',text:'반려 대상: 박서준 (1명)'}:null;persist();render();}return;}
if(action==='show-pw'){const input=$('login-pw');input.type=input.type==='password'?'text':'password';return;}
if(action==='one-page'){toast('현재 조회 결과는 모두 1페이지에 표시되어 있습니다.');return;}
if(action==='clear-filter'){if(state.step===20||state.step===21){state.keyword='';state.query='';state.dateFrom='';state.dateTo='';state.filterFrom='';state.filterTo='';state.searchBy='name';state.step=20;persist();render();}else toast('현재 미션을 마친 후 다음 안내를 따라 주세요.');return;}
if(action==='logout'||action==='back'){toast('오른쪽 미션을 마친 뒤 처음부터 다시 실습할 수 있습니다.');return;}
if(action==='modal-confirm'){if(!state.modal||!['confirm','ack'].includes(current()?.[0]))return;const m=state.modal;if(m.confirm){if(m.kind==='approve'){state.teachers.filter(t=>state.selected.includes(t.id)).forEach(t=>t.status='approved');state.selected=[];ack('승인되었습니다.','김하늘, 이도윤 선생님의 가입 승인이 완료되었습니다.','approved');}else if(m.kind==='reject'){if(!state.reasonDraft.trim()){state.step--;state.modal={kind:'reject-reason',title:'교사 가입 반려',text:'반려 사유를 입력해 주세요.'};persist();render();return;}state.teachers.filter(t=>state.selected.includes(t.id)).forEach(t=>{t.status='rejected';t.rejected='2026.10.18 10:00';t.reason=state.reasonDraft.trim();t.rejectedBy='school.admin@example.com';});state.selected=[];ack('반려되었습니다.','박서준 선생님의 계정이 반려 처리되었습니다.','rejected');}else if(m.kind==='password'){state.passwordReset=true;ack('비밀번호가 초기화되었습니다.','실습용 초기화가 완료되었습니다.\n실제 계정에는 영향을 주지 않습니다.','password-done');}}else{state.modal=null;advance();}return;}
if(action==='reject-reason'&&state.modal?.kind==='reject-reason'&&current()?.[0]==='reject-reason'){const reason=state.reasonDraft.trim();if(!reason){$('reason-error').textContent='반려 사유를 입력해 주세요.';$('reason-input').focus();return;}if(reason.length>500){$('reason-error').textContent='반려 사유는 500자 이내로 입력해 주세요.';return;}openConfirmation('reject','선택한 교사를 반려할까요?','반려 대상: 박서준 (1명)\n반려 사유: '+reason);return;}
if(action==='history-search'||action==='history-clear'){const t=state.teachers.find(t=>t.id===state.detailId);if(!t||state.page!=='detail'||state.edit||state.modal)return;if(action==='history-clear'){['history-from','history-to','history-keyword'].forEach(id=>$(id).value='');$('history-by').value='name';}$('history-result').innerHTML=historyRows(t,$('history-keyword').value.trim(),$('history-by').value,$('history-from').value,$('history-to').value);return;}
if(state.modal){toast('열려 있는 팝업을 먼저 확인해 주세요.');return;}
if(!guard(action))return;
switch(action){case'admin':state.page='login';advance();break;case'id':state.loginId=ADMIN_ID;advance();break;case'pw':state.loginPw=ADMIN_PW;advance();break;case'login':if(state.loginId!==ADMIN_ID||state.loginPw!==ADMIN_PW){toast('안내된 실습용 아이디와 비밀번호를 확인해 주세요.');return;}state.page='dashboard';advance();break;case'member-menu':state.expanded=true;advance();break;case'approval-menu':state.page='pending';advance();break;case'approve':if(state.selected.length!==2||!state.selected.includes('t1')||!state.selected.includes('t2')){toast('김하늘·이도윤 선생님 두 명을 선택하세요.');return;}openConfirmation('approve','선택한 교사를 승인할까요?','승인 대상: 김하늘, 이도윤 (2명)\n승인하면 해당 계정으로 플랫폼을 이용할 수 있습니다.');break;case'reject':if(state.selected.length!==1||state.selected[0]!=='t3'){toast('박서준 선생님 한 명만 선택하세요.');return;}state.modal={kind:'reject-reason',title:'교사 가입 반려',text:'반려 대상: 박서준 (1명)\n반려 사유를 입력해 주세요.'};advance();break;case'rejected-menu':state.page='rejected';state.keyword='';state.query='';advance();break;case'rejected-detail':if(el.dataset.id!=='t3'){toast('박서준 선생님의 반려 정보를 확인하세요.');return;}state.detailId='t3';state.page='rejected-detail';advance();break;case'review':state.page='rejected';state.detailId=null;advance();break;case'members-menu':state.page='members';state.keyword='';state.query='';advance();break;case'search':if(state.keyword.trim()!=='김하늘'||state.searchBy!=='name'){toast('검색 기준을 이름으로 선택하고 김하늘을 입력하세요.');return;}if(state.dateFrom||state.dateTo){toast('이번 검색에서는 가입기간을 비워 두세요.');return;}state.query=state.keyword.trim();state.filterFrom=state.dateFrom;state.filterTo=state.dateTo;advance();break;case'detail':if(el.dataset.id!=='t1'){toast('이번 미션에서는 김하늘 선생님의 정보를 확인하세요.');return;}state.detailId='t1';state.page='detail';advance();break;case'edit':state.edit=true;state.draftMobile=state.teachers.find(t=>t.id===state.detailId).mobile;advance();break;case'save':if(commitEdit())ack('저장되었습니다.','김하늘 선생님의 회원 정보가 저장되었습니다.','saved');break;case'reset-pw':openConfirmation('password','비밀번호를 초기화할까요?','초기화 대상: 김하늘\nhaneul.kim@example.com\n실습용 비밀번호 초기화를 진행합니다.');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)doAction(el.dataset.action,el);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form')doAction('login');if(e.target.id==='search-form')doAction('search');});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='reason-input'){state.reasonDraft=el.value;$('reason-error').textContent='';persist();highlight();return;}if(el.id==='login-id'){state.loginId=el.value;if(current()?.[0]==='id'&&el.value===ADMIN_ID){state.step++;persist();renderGuide();highlight();toast('아이디 입력 완료. 비밀번호를 입력하세요.');}else persist();}else if(el.id==='login-pw'){state.loginPw=el.value;if(current()?.[0]==='pw'&&el.value===ADMIN_PW){state.step++;persist();renderGuide();highlight();toast('비밀번호 입력 완료. 로그인을 클릭하세요.');}else persist();}else if(el.id==='keyword'){state.keyword=el.value;if(current()?.[0]==='keyword'&&el.value.trim()==='김하늘'){state.step++;persist();renderGuide();highlight();}else persist();}else if(el.id==='mobile'){state.draftMobile=el.value;if(current()?.[0]==='mobile'&&el.value.replace(/[^0-9]/g,'')==='01000001234'){state.step++;renderGuide();highlight();toast('연락처 입력 완료. 저장을 클릭하세요.');}persist();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.check){const action='check-'+el.dataset.check;if(!guard(action)){el.checked=state.selected.includes(el.dataset.check);return;}if(!el.checked){el.checked=true;return;}if(!state.selected.includes(el.dataset.check))state.selected.push(el.dataset.check);advance();}else if(el.dataset.all){el.checked=false;toast('이 미션에서는 지정된 교사만 한 명씩 선택하세요.');}else if(el.id==='search-by'){state.searchBy=el.value;persist();}else if(el.id==='date-from'){state.dateFrom=el.value;persist();}else if(el.id==='date-to'){state.dateTo=el.value;persist();}});
document.addEventListener('keydown',e=>{if(!state.modal){if((e.key==='Enter'||e.key===' ')&&['login-id','login-pw'].includes(e.target.id)){e.preventDefault();doAction(e.target.id==='login-id'?'id':'pw');}return;}if(e.key==='Escape'){e.preventDefault();if(state.modal.confirm||state.modal.kind==='restart'||state.modal.kind==='reject-reason')doAction('modal-cancel');return;}if(e.key==='Tab'){const nodes=[...$('modal-root').querySelectorAll('textarea,button')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
$('hint-toggle').addEventListener('click',()=>{state.hints=!state.hints;persist();highlight();});$('restart').addEventListener('click',()=>doAction('restart'));
render();
</script></body></html>
